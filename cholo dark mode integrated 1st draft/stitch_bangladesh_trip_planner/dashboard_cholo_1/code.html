<script>
    // ── Toast notification system ──────────────────────────────────────
    function showToast(message, type = 'info') {
        const existing = document.getElementById('cholo-toast');
        if (existing) existing.remove();
        const colors = { info: '#1D9E75', error: '#BA1A1A', success: '#1D9E75', warn: '#BA7517' };
        const toast = document.createElement('div');
        toast.id = 'cholo-toast';
        toast.style.cssText = `position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:${colors[type]||colors.info};color:#fff;padding:12px 24px;border-radius:9999px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.18);transition:opacity 0.4s;white-space:nowrap;`;
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
    }

    // ── Auth helpers ───────────────────────────────────────────────────
    function getCurrentUser() {
        try { return JSON.parse(localStorage.getItem('current_user')); } catch { return null; }
    }

    function ensureUser() {
        if (!localStorage.getItem('current_user')) {
            localStorage.setItem('current_user', JSON.stringify({
                id: 'guest_' + Date.now(), fullname: 'Explorer', username: 'guest',
                email: 'guest@cholo.travel', isGuest: true
            }));
        }
    }

    function logout() {
        localStorage.removeItem('cholo_token');
        localStorage.removeItem('current_user');
        window.location.href = '../start_screen_cholo_matched/code.html';
    }

    // ── Navigation ─────────────────────────────────────────────────────
    function handleNavClick(section) {
        if (section === 'planner') window.location.href = '../step_1_traveler_info_cholo_1/code.html';
        else if (section === 'saved') showSavedTrips();
        else if (section === 'profile') showProfilePanel();
    }

    function showSavedTrips() {
        const trips = JSON.parse(localStorage.getItem('cholo_saved_trips') || '[]');
        if (trips.length === 0) {
            showToast('No saved trips yet — start planning!', 'info');
        } else {
            showToast(`You have ${trips.length} saved trip${trips.length > 1 ? 's' : ''}`, 'success');
        }
    }

    function showProfilePanel() {
        const panel = document.getElementById('profilePanel');
        if (panel) { panel.classList.toggle('hidden'); return; }

        const user = getCurrentUser();
        const div = document.createElement('div');
        div.id = 'profilePanel';
        div.style.cssText = 'position:fixed;bottom:80px;right:16px;z-index:1000;background:#fff;border-radius:1.5rem;box-shadow:0 20px 60px rgba(0,0,0,0.15);padding:24px;min-width:240px;border:1px solid #e1e3e4;';
        div.innerHTML = `
          <div class="flex items-center gap-3 mb-4">
            <img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user?.fullname||user?.username||'U')}&background=1D9E75&color=fff&size=48" style="width:48px;height:48px;border-radius:9999px;"/>
            <div>
              <p style="font-weight:800;color:#191C1B;font-size:15px;">${user?.fullname||user?.username||'Explorer'}</p>
              <p style="font-size:12px;color:#707974;">${user?.email||'guest@cholo.travel'}</p>
            </div>
          </div>
          <hr style="margin:12px 0;border-color:#e1e3e4;"/>
          <button onclick="showToast('Settings coming soon!','info')" style="width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;color:#191C1B;background:none;border:none;cursor:pointer;font-size:14px;" onmouseover="this.style.background='#F0F4F2'" onmouseout="this.style.background='none'">⚙️ Settings</button>
          <button onclick="logout()" style="width:100%;text-align:left;padding:10px 12px;border-radius:12px;font-weight:600;color:#BA1A1A;background:none;border:none;cursor:pointer;font-size:14px;" onmouseover="this.style.background='#fff0f0'" onmouseout="this.style.background='none'">🚪 Sign Out</button>
          <button onclick="this.closest('#profilePanel').remove()" style="position:absolute;top:12px;right:12px;background:none;border:none;cursor:pointer;font-size:20px;color:#707974;">×</button>
        `;
        document.body.appendChild(div);
        setTimeout(() => document.addEventListener('click', function closePanel(e) {
            if (!div.contains(e.target)) { div.remove(); document.removeEventListener('click', closePanel); }
        }, true), 100);
    }

    // ── Theme ──────────────────────────────────────────────────────────
    function toggleTheme() {
        const isDark = localStorage.getItem('theme') === 'dark';
        localStorage.setItem('theme', isDark ? 'light' : 'dark');
        window.location.href = isDark ? location.href : '../dashboard_cholo_2/code.html';
    }

    // ── Init ───────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        ensureUser();
        const user = getCurrentUser();

        // Update welcome text
        const h2 = document.querySelector('main h2');
        if (h2 && user) h2.textContent = `Hello, ${user.fullname || user.username}!`;

        // Update avatar
        const avatar = document.getElementById('dashUserAvatar');
        if (avatar && user) {
            avatar.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.fullname||user.username||'U')}&background=1D9E75&color=fff&size=80`;
        }

        // Notifications button
        document.querySelector('button[data-icon="notifications"]')?.addEventListener('click', () => {
            showToast('No new notifications', 'info');
        });

        // Theme toggle
        document.querySelector('button[data-icon="dark_mode"]')?.addEventListener('click', toggleTheme);
    });
</script>
