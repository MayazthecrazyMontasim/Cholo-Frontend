<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Cholo - Login</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#1D9E75",
                        "on-primary": "#ffffff",
                        "primary-container": "#D1F2E7",
                        "on-primary-container": "#002116",
                        secondary: "#4A6359",
                        "on-secondary": "#ffffff",
                        surface: "#F8FAF9",
                        "on-surface": "#191C1B",
                        "surface-container": "#ffffff",
                        outline: "#707974",
                        "outline-variant": "#BFC9C3",
                        background: "#F0F4F2"
                    },
                    borderRadius: {
                        DEFAULT: "0.5rem",
                        lg: "0.75rem",
                        xl: "1rem",
                        full: "9999px"
                    },
                    fontFamily: {
                        headline: ["Be Vietnam Pro", "sans-serif"],
                        body: ["Hind Siliguri", "sans-serif"],
                    }
                },
            },
        };
    </script>
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Hind Siliguri', sans-serif; min-height: max(884px, 100dvh); }
        .logo-font { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
    <main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
        <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-[20%] -left-[10%] w-[600px] h-[600px] bg-primary/5 rounded-full blur-[120px]"></div>
            <div class="absolute top-[40%] -right-[15%] w-[500px] h-[500px] bg-primary/10 rounded-full blur-[120px]"></div>
        </div>
        <div class="w-full max-w-md z-10">
            <div class="bg-surface-container border border-outline-variant/50 rounded-2xl p-8 shadow-sm">
                <div class="flex flex-col items-center mb-10">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-primary text-4xl">travel_explore</span>
                        <span class="text-3xl font-black logo-font tracking-tighter text-on-surface">Cholo</span>
                    </div>
                    <h1 class="text-2xl font-bold text-on-surface">Welcome back</h1>
                    <p class="text-outline mt-1 text-sm">Adventure awaits you</p>
                </div>

                <!-- Error message box -->
                <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-50 border border-red-200 text-red-700 text-sm"></div>

                <form class="space-y-6" onsubmit="handleLogin(event)">
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-outline uppercase tracking-wider ml-1" for="username">Username or Email</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
                            <input class="w-full bg-surface border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/50"
                                id="username" placeholder="Enter your username or email" type="text" required/>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="block text-xs font-bold text-outline uppercase tracking-wider ml-1" for="password">Password</label>
                        <div class="relative group">
                            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
                            <input class="w-full bg-surface border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/50"
                                id="password" placeholder="Enter your password" type="password" required/>
                            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button" onclick="togglePassword('password')">
                                <span class="material-symbols-outlined text-xl">visibility</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between">
                        <label class="flex items-center gap-2 text-xs text-outline">
                            <input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary focus:ring-2" id="remember" type="checkbox"/>
                            Remember me
                        </label>
                        <a href="#" onclick="showForgotPassword(); return false;" class="text-xs text-primary font-semibold hover:underline">Forgot password?</a>
                    </div>
                    <button id="loginBtn" class="w-full bg-primary text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                        <span id="loginBtnText">Log In</span>
                        <span class="material-symbols-outlined" id="loginBtnIcon">arrow_forward</span>
                    </button>
                </form>

                <div class="relative my-8">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
                    <div class="relative flex justify-center text-xs uppercase">
                        <span class="bg-surface-container px-4 text-outline font-bold tracking-widest">or</span>
                    </div>
                </div>

                <div class="grid grid-cols-1 gap-3">
                    <button type="button" class="w-full border border-outline-variant bg-surface hover:bg-background text-on-surface py-3.5 rounded-xl font-semibold transition-colors flex items-center justify-center gap-3"
                        onclick="window.location.href='../signup_page_cholo_matched_1/code.html'">
                        <span class="material-symbols-outlined text-primary">person_add</span>
                        Create Account
                    </button>
                </div>
                <p class="mt-8 text-center text-sm text-outline font-medium">
                    New to Cholo? <a class="text-primary font-bold hover:underline" href="../signup_page_cholo_matched_1/code.html">Create Account</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="py-8 px-6 text-center z-10">
        <div class="flex justify-center items-center gap-6 text-outline text-xs font-bold uppercase tracking-widest mb-4">
            <a href="#" onclick="showPrivacy(); return false;" class="hover:text-primary transition-colors">Privacy</a>
            <a href="#" onclick="showTerms(); return false;" class="hover:text-primary transition-colors">Terms</a>
            <a href="#" onclick="showHelp(); return false;" class="hover:text-primary transition-colors">Help</a>
        </div>
        <p class="text-outline/60 text-xs">© 2024 Cholo Travel Ecosystem. All rights reserved.</p>
    </footer>

    <div class="fixed top-6 right-6 hidden md:block">
        <div class="flex items-center gap-1 bg-surface-container p-1 rounded-full border border-outline-variant shadow-sm">
            <button onclick="toggleTheme()" aria-label="Toggle dark mode" class="w-9 h-9 flex items-center justify-center text-primary hover:bg-primary/10 rounded-full transition-colors">
                <span class="material-symbols-outlined text-[20px]">dark_mode</span>
            </button>
            <button class="px-4 py-2 text-xs font-bold text-on-primary bg-primary rounded-full">EN</button>
            <button class="px-4 py-2 text-xs font-bold text-outline hover:text-primary transition-colors">BN</button>
        </div>
    </div>

    <script>
        // ── API config ──────────────────────────────────────────
        function getApiBaseUrl() {
            if (window.location.protocol === 'file:' ||
                window.location.hostname === 'localhost' ||
                window.location.hostname === '127.0.0.1') {
                return "http://localhost:8000";
            }
            return "https://cholo-live-api.onrender.com";
        }
        const API_BASE_URL = getApiBaseUrl();

        // ── UI helpers ──────────────────────────────────────────
        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.remove('hidden');
        }
        function hideError() {
            document.getElementById('errorBox').classList.add('hidden');
        }
        function setLoading(loading) {
            const btn = document.getElementById('loginBtn');
            const txt = document.getElementById('loginBtnText');
            const ico = document.getElementById('loginBtnIcon');
            btn.disabled = loading;
            txt.textContent = loading ? 'Logging in...' : 'Log In';
            ico.textContent = loading ? 'hourglass_empty' : 'arrow_forward';
            btn.classList.toggle('opacity-70', loading);
        }

        // ── Fetch with timeout helper ───────────────────────────
        function fetchWithTimeout(url, options, ms = 10000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), ms);
            return fetch(url, { ...options, signal: controller.signal })
                .finally(() => clearTimeout(id));
        }

        // ── Local user lookup (offline fallback) ────────────────
        function tryLocalLogin(username, password) {
            const users = JSON.parse(localStorage.getItem('cholo_users') || '[]');
            return users.find(u =>
                (u.username === username || u.email === username) && u.password === password
            ) || null;
        }

        // ── Main login handler ──────────────────────────────────
        async function handleLogin(event) {
            event.preventDefault();
            hideError();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember')?.checked ?? true;

            if (!username || !password) { showError('Please fill in all fields'); return; }

            setLoading(true);

            try {
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetchWithTimeout(`${API_BASE_URL}/auth/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                }, 10000);

                const data = await response.json();

                if (response.ok && data.access_token) {
                    const storage = remember ? localStorage : sessionStorage;
                    storage.setItem('cholo_token', data.access_token);
                    localStorage.setItem('current_user', JSON.stringify({ username, isGuest: false }));

                    // Fetch full profile
                    try {
                        const p = await fetchWithTimeout(`${API_BASE_URL}/auth/me`, {
                            headers: { 'Authorization': `Bearer ${data.access_token}` }
                        }, 5000);
                        if (p.ok) localStorage.setItem('current_user', JSON.stringify(await p.json()));
                    } catch (_) {}

                    window.location.href = '../step_1_traveler_info_cholo_1/code.html';
                } else {
                    showError(data.detail || 'Invalid username or password');
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                    // API timed out — try local fallback
                    const local = tryLocalLogin(username, password);
                    if (local) {
                        localStorage.setItem('current_user', JSON.stringify(local));
                        window.location.href = '../step_1_traveler_info_cholo_1/code.html';
                        return;
                    }
                    showError('Server is starting up (Render cold start). Please wait 30 seconds and try again, or Continue as Guest.');
                } else {
                    showError('Could not connect to server. Check your connection and try again.');
                }
            } finally {
                setLoading(false);
            }
        }

        // ── Misc ────────────────────────────────────────────────
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const btn = field.parentElement.querySelector('button span');
            if (field.type === 'password') {
                field.type = 'text';
                btn.textContent = 'visibility_off';
            } else {
                field.type = 'password';
                btn.textContent = 'visibility';
            }
        }

        function toggleTheme() {
            localStorage.setItem('theme', 'dark');
            window.location.href = '../login_page_cholo_matched_2/code.html';
        }

        function showToast(msg, type) {
            const e = document.getElementById('cholo-toast'); if (e) e.remove();
            const colors = { info: '#1D9E75', warn: '#BA7517', error: '#BA1A1A' };
            const t = document.createElement('div'); t.id = 'cholo-toast';
            t.style.cssText = `position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:${colors[type]||colors.info};color:#fff;padding:12px 24px;border-radius:9999px;font-weight:700;font-size:14px;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.18);white-space:nowrap;`;
            t.textContent = msg; document.body.appendChild(t);
            setTimeout(() => { t.style.transition='opacity 0.4s'; t.style.opacity='0'; setTimeout(()=>t.remove(),400); }, 3000);
        }
        function showForgotPassword() { showToast('Password reset — contact support@cholo.travel', 'info'); }
        function showTerms()    { showToast('By using Cholo, you agree to our terms of service.', 'info'); }
        function showPrivacy()  { showToast('We protect your personal data — privacy@cholo.travel', 'info'); }
        function showHelp()     { showToast('Need help? Contact support@cholo.travel', 'info'); }

        // Auto-redirect if already logged in
        window.onload = function() {
            const token = localStorage.getItem('cholo_token') || sessionStorage.getItem('cholo_token');
            if (token) {
                window.location.href = '../dashboard_cholo_1/code.html';
            }
        };
    </script>
</body>
</html>
