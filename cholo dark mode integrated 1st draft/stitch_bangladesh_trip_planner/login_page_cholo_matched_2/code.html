<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cholo - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Be+Vietnam+Pro:wght@700;900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#1D9E75",
          "on-primary": "#ffffff",
          "primary-container": "#144D3A",
          "on-primary-container": "#D1F2E7",
          secondary: "#4A6359",
          "on-secondary": "#ffffff",
          surface: "#141B18",
          "on-surface": "#E1E3E0",
          "surface-container": "#0f1512",
          outline: "#89938E",
          "outline-variant": "#3F4944",
          background: "#0b100e"
        },
        borderRadius: { DEFAULT: "0.5rem", lg: "0.75rem", xl: "1rem", full: "9999px" },
        fontFamily: { headline: ["Be Vietnam Pro","sans-serif"], body: ["Hind Siliguri","sans-serif"] }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
  body { font-family:'Hind Siliguri',sans-serif; min-height:max(884px,100dvh); }
  .logo-font { font-family:'Be Vietnam Pro',sans-serif; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col">
<main class="flex-grow flex items-center justify-center px-6 py-12 relative overflow-hidden">
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-[20%] -left-[10%] w-[600px] h-[600px] bg-primary/10 rounded-full blur-[120px]"></div>
    <div class="absolute top-[40%] -right-[15%] w-[500px] h-[500px] bg-primary/5 rounded-full blur-[120px]"></div>
  </div>
  <div class="w-full max-w-md z-10">
    <div class="bg-surface-container border border-outline-variant/50 rounded-2xl p-8 shadow-2xl">
      <div class="flex flex-col items-center mb-10">
        <div class="flex items-center gap-2 mb-4">
          <span class="material-symbols-outlined text-primary text-4xl">travel_explore</span>
          <span class="text-3xl font-black logo-font tracking-tighter text-on-surface">Cholo</span>
        </div>
        <h1 class="text-2xl font-bold text-on-surface">Welcome back</h1>
        <p class="text-outline mt-1 text-sm">Adventure awaits you</p>
      </div>

      <!-- ✅ CHANGE 1: Added error box (same as light mode, dark-themed colors) -->
      <div id="errorBox" class="hidden mb-4 px-4 py-3 rounded-xl bg-red-900/30 border border-red-500/40 text-red-400 text-sm"></div>

      <form id="loginForm" class="space-y-6">
        <div class="space-y-2">
          <label class="block text-xs font-bold text-outline uppercase tracking-wider ml-1" for="email">Email Address</label>
          <div class="relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
            <input class="w-full bg-surface border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/40"
              id="email" placeholder="Enter your email" type="email" required/>
          </div>
        </div>
        <div class="space-y-2">
          <div class="flex justify-between items-center ml-1">
            <label class="block text-xs font-bold text-outline uppercase tracking-wider" for="password">Password</label>
            <a class="text-xs font-semibold text-primary hover:underline" href="#">Forgot password?</a>
          </div>
          <div class="relative group">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
            <input class="w-full bg-surface border border-outline-variant rounded-xl py-3.5 pl-12 pr-4 text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all placeholder:text-outline/40"
              id="password" placeholder="••••••••" type="password" required/>
            <button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface" type="button" onclick="togglePassword()">
              <span id="visIcon" class="material-symbols-outlined text-xl">visibility</span>
            </button>
          </div>
        </div>

        <!-- ✅ CHANGE 2: Button now has id + loading states like light mode -->
        <button id="loginBtn" class="w-full bg-primary text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
          <span id="loginBtnText">Login</span>
          <span id="loginBtnIcon" class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <div class="relative my-8">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant"></div></div>
        <div class="relative flex justify-center text-xs uppercase">
          <span class="bg-surface-container px-4 text-outline font-bold tracking-widest">or</span>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-3">
        <button id="guestBtn" class="w-full border border-outline-variant bg-surface hover:bg-background text-on-surface py-3.5 rounded-xl font-semibold transition-colors flex items-center justify-center gap-3">
          <span class="material-symbols-outlined text-primary">person_outline</span>
          Start as Guest
        </button>
      </div>
      <p class="mt-8 text-center text-sm text-outline font-medium">
        New to Cholo? <a id="createAccountLink" class="text-primary font-bold hover:underline" href="#">Create Account</a>
      </p>
    </div>
  </div>
</main>

<footer class="py-8 px-6 text-center z-10">
  <div class="flex justify-center items-center gap-6 text-outline text-xs font-bold uppercase tracking-widest mb-4">
    <a class="hover:text-primary transition-colors" href="#">Privacy</a>
    <a class="hover:text-primary transition-colors" href="#">Terms</a>
    <a class="hover:text-primary transition-colors" href="#">Help</a>
  </div>
  <p class="text-outline/60 text-xs">© 2024 Cholo Travel Ecosystem. All rights reserved.</p>
</footer>

<div class="fixed top-6 right-6 hidden md:block">
  <div class="flex items-center gap-1 bg-surface-container p-1 rounded-full border border-outline-variant shadow-sm">
    <button id="themeToggle" aria-label="Toggle light mode" class="w-9 h-9 flex items-center justify-center text-primary bg-primary/10 rounded-full transition-colors">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings:'FILL' 1;">light_mode</span>
    </button>
    <button class="px-4 py-2 text-xs font-bold text-on-primary bg-primary rounded-full">EN</button>
    <button class="px-4 py-2 text-xs font-bold text-outline hover:text-primary transition-colors">BN</button>
  </div>
</div>

<script>
  // ── API config (same as light mode) ─────────────────────────
  const API_BASE_URL = (
    window.location.protocol === 'file:' ||
    window.location.hostname === 'localhost' ||
    window.location.hostname === '127.0.0.1'
  ) ? "http://localhost:8000" : "https://cholo-live-api.onrender.com";

  // ── CHANGE 3: Theme toggle — redirect to light mode file ────
  const themeToggleBtn = document.getElementById('themeToggle');
  if (localStorage.getItem('theme') === 'light') {
    window.location.replace('../login_page_cholo_matched_1/code.html');
  }
  themeToggleBtn.addEventListener('click', () => {
    localStorage.setItem('theme', 'light');
    window.location.href = '../login_page_cholo_matched_1/code.html';
  });

  // ── Navigation links ─────────────────────────────────────────
  document.getElementById('createAccountLink').addEventListener('click', e => {
    e.preventDefault();
    window.location.href = '../signup_page_cholo_dark/code.html';
  });
  document.getElementById('guestBtn').addEventListener('click', () => {
    window.location.href = '../step_1_traveler_info_cholo_1/code.html';
  });

  // ── UI helpers ───────────────────────────────────────────────
  function showError(msg) {
    const box = document.getElementById('errorBox');
    box.textContent = msg;
    box.classList.remove('hidden');
  }
  function hideError() { document.getElementById('errorBox').classList.add('hidden'); }

  // ✅ CHANGE 4: Unified loading state (same pattern as light mode)
  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    document.getElementById('loginBtnText').textContent = on ? 'Logging in...' : 'Login';
    document.getElementById('loginBtnIcon').textContent = on ? 'hourglass_empty' : 'arrow_forward';
    btn.disabled = on;
    btn.classList.toggle('opacity-70', on);
  }

  function togglePassword() {
    const f = document.getElementById('password');
    const ico = document.getElementById('visIcon');
    f.type = f.type === 'password' ? 'text' : 'password';
    ico.textContent = f.type === 'password' ? 'visibility' : 'visibility_off';
  }

  // ── CHANGE 5: Login handler — same API logic as light mode ───
  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    hideError();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) { showError('Please fill in all fields'); return; }

    setLoading(true);
    try {
      const formData = new URLSearchParams();
      formData.append('username', email);   // FastAPI OAuth2 uses "username" field
      formData.append('password', password);

      const res = await fetch(`${API_BASE_URL}/auth/token`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: formData
      });

      const data = await res.json();

      if (res.ok && data.access_token) {
        localStorage.setItem('cholo_token', data.access_token);

        // Fetch user profile
        try {
          const profile = await fetch(`${API_BASE_URL}/auth/me`, {
            headers: { 'Authorization': `Bearer ${data.access_token}` }
          });
          if (profile.ok) {
            localStorage.setItem('current_user', JSON.stringify(await profile.json()));
          }
        } catch (_) {}

        window.location.href = '../step_1_traveler_info_cholo_1/code.html';
      } else {
        showError(data.detail || 'Invalid email or password');
      }
    } catch (err) {
      console.error(err);
      showError('Could not connect to server. Please try again.');
    } finally {
      setLoading(false);
    }
  });

  // Auto-redirect if already logged in
  if (localStorage.getItem('cholo_token')) {
    window.location.href = '../dashboard_cholo_2/code.html';
  }
</script>
</body>
</html>
